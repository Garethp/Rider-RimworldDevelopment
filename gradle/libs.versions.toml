[versions]
kotlin = "2.3.20" # https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library
# Same release train as JetBrains.Lifetimes/RdFramework: keep it equal to the version the Rider SDK in
# Directory.Build.props resolves (obj/*/project.assets.json). Only matters when regenerating the protocol (:protocol:rdgen).
rdGen = "2026.1.3" # https://github.com/JetBrains/rd/releases
intellijPlatform = "2.15.0" # https://github.com/JetBrains/intellij-platform-gradle-plugin/releases
gradleJvmWrapper = "0.16.0" # https://github.com/mfilippov/gradle-jvm-wrapper/releases

[libraries]
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
rdGen = { group = "com.jetbrains.rd", name = "rd-gen", version.ref = "rdGen" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
gradleJvmWrapper = { id = "me.filippov.gradle.jvm.wrapper", version.ref = "gradleJvmWrapper" }
rdGen = { id = "com.jetbrains.rdgen", version.ref = "rdGen" }
