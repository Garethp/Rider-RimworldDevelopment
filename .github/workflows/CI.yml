name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: configure_java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./gradlew :buildPlugin --no-daemon
      - run: ./gradlew :buildResharperPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}.CI.${{ github.head_ref || github.ref_name }}
          path: output
  Test:
    # The ReSharper test shell needs the Windows Desktop runtime (WPF/WinForms). It does not run on Linux, and the
    # reasons are recorded in docs/testing-research.md, "Platform".
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'src/dotnet/**/*.csproj', 'src/dotnet/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Same command as Gradle's :testDotNet, without needing Java/Gradle on this runner.
      - run: dotnet test ReSharperPlugin.RimworldDev.sln --logger GitHubActions
