name: Deploy

on:
  push:
    tags:
      - '*.*.*'

jobs:
  Publish:
    # Windows so that :publishPlugin's dependency on :testDotNet runs the real backend test suite before anything is
    # published (the ReSharper test shell only runs on Windows; on Linux every test reports as skipped). Releases are
    # rare, so the Windows runner cost is acceptable here, unlike on every PR commit (see Tests.yml).
    runs-on: windows-latest
    environment: Deploy
    defaults:
      run:
        # ./gradlew and the output/* globs below are written for bash; Windows runners ship Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: configure_java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish Rider Package
        run: ./gradlew :publishPlugin -PBuildConfiguration="Release" -PPluginVersion="${{ github.ref_name }}" -PPublishToken="${{ secrets.PUBLISH_TOKEN }}"
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - run: ./gradlew :buildResharperPlugin
      - name: Publish ReSharper Package
        run: dotnet nuget push --source "https://plugins.jetbrains.com/api/v2/package" --api-key "$PUBLISH_TOKEN" output/ReSharperPlugin*.nupkg
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} output/*